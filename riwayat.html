<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Riwayat Laporan Barang Temuan dan Barang Hilang">
  <title>Riwayat — Barang Temuan</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/riwayat.css">
</head>
<body>

  <!-- Mobile Frame Container -->
  <main class="mobile-frame" role="main">

    <!-- Status Bar (08:40, Signal, Wi-Fi, Battery) -->
    <div class="status-bar" aria-label="Status Bar">
      <span class="status-time">08:40</span>
      <div class="status-icons">
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="8" width="2.5" height="3" rx="0.5"></rect>
          <rect x="4" y="5.5" width="2.5" height="5.5" rx="0.5"></rect>
          <rect x="8" y="3" width="2.5" height="8" rx="0.5"></rect>
          <rect x="12" y="0" width="2.5" height="11" rx="0.5"></rect>
        </svg>
        <svg width="15" height="11" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"></path>
          <path d="M4.2 7.7a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 1-1.1 1.1 4 4 0 0 0-5.4 0 .8.8 0 0 1-1.1-1.1z"></path>
          <path d="M1.5 5a9.2 9.2 0 0 1 13 0 .8.8 0 0 1-1.1 1.1 7.6 7.6 0 0 0-10.8 0 .8.8 0 0 1-1.1-1.1z"></path>
        </svg>
        <svg width="22" height="11" viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
          <rect x="1" y="1" width="19" height="10" rx="3"></rect>
          <rect x="3" y="3" width="12" height="6" rx="1.5" fill="currentColor"></rect>
          <path d="M22 4.5v3" stroke-linecap="round"></path>
        </svg>
      </div>
    </div>

    <!-- 1. Header Halaman Riwayat -->
    <header class="page-header">
      <div class="header-main-row">
        <div class="header-text-col">
          <h1 class="page-title">Riwayat</h1>
          <p class="page-desc">Pantau aktivitas dan laporan Anda.</p>
        </div>
        <div class="header-user-badge" id="headerUserBadge" style="display: none;" title="Pengguna Aktif">
          <span class="user-avatar-initial" id="userInitial">U</span>
        </div>
      </div>
    </header>

    <!-- 2. Filter Riwayat Horizontal -->
    <nav class="filter-section" aria-label="Filter Kategori Riwayat">
      <div class="filter-tabs" role="tablist">
        <button type="button" class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
          Semua <span class="tab-count" id="countAll">0</span>
        </button>
        <button type="button" class="filter-tab" data-filter="hilang" role="tab" aria-selected="false">
          Barang Hilang <span class="tab-count" id="countHilang">0</span>
        </button>
        <button type="button" class="filter-tab" data-filter="ditemukan" role="tab" aria-selected="false">
          Barang Ditemukan <span class="tab-count" id="countDitemukan">0</span>
        </button>
      </div>
    </nav>

    <!-- 3. Daftar Riwayat & Konten -->
    <div class="history-content-scroll" id="historyContentScroll">

      <!-- Status Info Bar -->
      <div class="summary-info-bar" id="summaryInfoBar" style="display: none;">
        <span id="summaryText">Menampilkan laporan aktif</span>
        <button type="button" class="btn-refresh" id="btnRefresh" title="Segarkan Data" aria-label="Segarkan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>

      <!-- Container Daftar Kartu Riwayat -->
      <div class="history-list" id="historyList" role="region" aria-label="Daftar Riwayat Laporan">
        <!-- Render dinamis via js/riwayat.js -->
      </div>

      <!-- 6. Kondisi Kosong (Empty State) -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon-wrap" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <h2 class="empty-title">Belum Ada Riwayat</h2>
        <p class="empty-desc">Aktivitas laporan Anda akan muncul di sini.</p>
        <div class="empty-actions">
          <a href="lapor-hilang.html" class="btn-empty-action btn-empty-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Lapor Barang Hilang
          </a>
          <a href="lapor-temuan.html" class="btn-empty-action btn-empty-secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            Lapor Barang Temuan
          </a>
        </div>
      </div>

    </div>

    <!-- 8. Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="Navigasi Utama">
      <div class="nav-items">
        <!-- 1. Beranda -->
        <a href="index.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3l9-8z"></path>
          </svg>
          <span>Beranda</span>
        </a>

        <!-- 2. Riwayat (Active) -->
        <a href="riwayat.html" class="nav-item active" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8v4l3 3"></path>
            <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path>
          </svg>
          <span>Riwayat</span>
        </a>

        <!-- 3. Pesan -->
        <a href="pesan.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          <span>Pesan</span>
        </a>

        <!-- 4. Profile -->
        <a href="profile.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Profile</span>
        </a>
      </div>

      <!-- Home Indicator -->
      <div class="home-indicator" aria-hidden="true"></div>
    </nav>

  </main>

  <!-- Scripts -->
  <script src="js/riwayat.js"></script>
</body>
</html>
