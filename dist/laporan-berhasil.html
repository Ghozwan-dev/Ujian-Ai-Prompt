<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Laporan Berhasil - Barang Temuan">
  <title>Laporan Berhasil — Barang Temuan</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/laporan-berhasil.css">
</head>
<body>

  <!-- Mobile Frame Container -->
  <main class="mobile-frame" role="main">

    <!-- Status Bar (08:40, Signal, Wi-Fi, Battery) -->
    <div class="status-bar" aria-label="Status Bar">
      <span class="status-time">08:40</span>
      <div class="status-icons">
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="8" width="2.5" height="3" rx="0.5"></rect>
          <rect x="4" y="5.5" width="2.5" height="5.5" rx="0.5"></rect>
          <rect x="8" y="3" width="2.5" height="8" rx="0.5"></rect>
          <rect x="12" y="0" width="2.5" height="11" rx="0.5"></rect>
        </svg>
        <svg width="15" height="11" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"></path>
          <path d="M4.2 7.7a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 1-1.1 1.1 4 4 0 0 0-5.4 0 .8.8 0 0 1-1.1-1.1z"></path>
          <path d="M1.5 5a9.2 9.2 0 0 1 13 0 .8.8 0 0 1-1.1 1.1 7.6 7.6 0 0 0-10.8 0 .8.8 0 0 1-1.1-1.1z"></path>
        </svg>
        <svg width="22" height="11" viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
          <rect x="1" y="1" width="19" height="10" rx="3"></rect>
          <rect x="3" y="3" width="12" height="6" rx="1.5" fill="currentColor"></rect>
          <path d="M22 4.5v3" stroke-linecap="round"></path>
        </svg>
      </div>
    </div>

    <!-- Main Content Wrapper -->
    <div class="content-wrapper">
      <!-- 2. Ilustrasi Utama (Tas Biru / Kotak Paket + Centang Hijau) -->
      <div class="illustration-wrap">
        <img 
          id="successIllustration"
          src="assets/success-backpack.png" 
          alt="Laporan Berhasil" 
          class="success-illustration"
          width="136"
          height="125"
        >
      </div>

      <!-- 3. Judul -->
      <h1 class="success-title">Laporan Berhasil</h1>

      <!-- 4. Deskripsi -->
      <p class="success-desc" id="successDesc">
        Terima kasih telah melapor,<br>
        kami akan membantu<br>
        mencari barang Anda.
      </p>

      <!-- 5. Tombol Lihat Detail -->
      <a href="detail-laporan.html" class="btn-detail" id="btnLihatDetail">Lihat Detail</a>
    </div>

    <!-- Home Indicator -->
    <div class="bottom-bar" aria-hidden="true">
      <div class="home-indicator"></div>
    </div>

  </main>

  <script>
    // Ambil ID laporan dari parameter URL dan hubungkan tombol Lihat Detail
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const reportId = urlParams.get('id');
      const tipe = urlParams.get('tipe');
      const btn = document.getElementById('btnLihatDetail');
      const img = document.getElementById('successIllustration');
      const desc = document.getElementById('successDesc');

      let currentTipe = tipe;

      if (reportId) {
        btn.href = 'detail-laporan.html?id=' + encodeURIComponent(reportId);
        if (!currentTipe && reportId.startsWith('LT-')) {
          currentTipe = 'ditemukan';
        }
      } else {
        try {
          const latest = localStorage.getItem('barangtemuan_latest_report');
          if (latest) {
            const parsed = JSON.parse(latest);
            if (parsed && parsed.id) {
              btn.href = 'detail-laporan.html?id=' + encodeURIComponent(parsed.id);
              if (!currentTipe && parsed.tipe === 'Ditemukan') {
                currentTipe = 'ditemukan';
              }
            }
          }
        } catch (e) {
          console.error(e);
        }
      }

      // Jika kategori laporan adalah barang temuan, adaptasi ilustrasi & teks sesuai spesifikasi
      if (currentTipe === 'ditemukan') {
        img.src = 'assets/success-package.png';
        img.alt = 'Laporan Berhasil Barang Temuan';
        img.width = 148;
        img.height = 136;
        desc.innerHTML = 'Terima kasih telah melaporkan<br>barang temuan Anda.<br>kami akan memverifikasi<br>informasi tersebut';
      }
    })();
  </script>
</body>
</html>
