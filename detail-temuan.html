<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Detail Temuan - Barang Temuan">
  <title>Detail Temuan — Barang Temuan</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/detail-temuan.css">
</head>
<body>

  <!-- Mobile Frame Container -->
  <main class="mobile-frame" role="main">

    <!-- Status Bar (08:40, Signal, Wi-Fi, Battery) -->
    <div class="status-bar" aria-label="Status Bar">
      <span class="status-time">08:40</span>
      <div class="status-icons">
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="8" width="2.5" height="3" rx="0.5"></rect>
          <rect x="4" y="5.5" width="2.5" height="5.5" rx="0.5"></rect>
          <rect x="8" y="3" width="2.5" height="8" rx="0.5"></rect>
          <rect x="12" y="0" width="2.5" height="11" rx="0.5"></rect>
        </svg>
        <svg width="15" height="11" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"></path>
          <path d="M4.2 7.7a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 1-1.1 1.1 4 4 0 0 0-5.4 0 .8.8 0 0 1-1.1-1.1z"></path>
          <path d="M1.5 5a9.2 9.2 0 0 1 13 0 .8.8 0 0 1-1.1 1.1 7.6 7.6 0 0 0-10.8 0 .8.8 0 0 1-1.1-1.1z"></path>
        </svg>
        <svg width="22" height="11" viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
          <rect x="1" y="1" width="19" height="10" rx="3"></rect>
          <rect x="3" y="3" width="12" height="6" rx="1.5" fill="currentColor"></rect>
          <path d="M22 4.5v3" stroke-linecap="round"></path>
        </svg>
      </div>
    </div>

    <!-- 1. Header -->
    <header class="app-header">
      <a href="hasil-pencocokan.html" class="btn-back" id="btnBack" title="Kembali" aria-label="Kembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <h1 class="header-title">Detail Temuan</h1>
    </header>

    <!-- Main Content Area -->
    <div class="content-area">

      <!-- 2. Foto Barang (Area Foto dengan Border Biru) -->
      <div class="item-photo-card">
        <img id="itemPhoto" class="item-photo-img" src="assets/item-iphone.png" alt="Foto Barang">
      </div>

      <!-- 3. Informasi Barang -->
      <div class="item-info-section">
        <h2 class="item-name" id="itemName">Iphone 18 Pro</h2>
        <div class="report-owner-label" id="reportOwnerLabel">Laporan Pemilik : #4867284-01</div>
      </div>

      <!-- 4. Kartu Informasi Pemilik -->
      <div class="owner-card">
        <div class="owner-card-header">Informasi Pemilik</div>
        <div class="owner-content-row">
          <!-- Foto Profil (Ikon profil pengguna berwarna hitam) -->
          <div class="owner-avatar-wrap" aria-hidden="true">
            <svg class="owner-avatar-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
            </svg>
          </div>
          <div class="owner-details">
            <div class="owner-name" id="ownerName">Rina Amelia</div>
            <div class="owner-separator"></div>
            <div class="owner-phone" id="ownerPhone">0823-8743-3645</div>
          </div>
        </div>
      </div>

      <!-- 5. Tombol Hubungi Pemilik -->
      <a href="tel:082387433645" class="btn-contact" id="btnContact">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24 11.4 11.4 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.4 11.4 0 00.57 3.57 1 1 0 01-.25 1.02l-2.2 2.2z"></path>
        </svg>
        <span>Hubungi Pemilik</span>
      </a>

      <!-- 6. Tombol Tandai Sudah Dihubungi -->
      <button type="button" class="btn-mark-contacted" id="btnMarkContacted">
        <svg id="markContactedIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="markContactedText">Tandai Sudah Dihubungi</span>
      </button>

      <!-- 7. Kartu Peringatan -->
      <div class="warning-card">
        <div class="warning-icon-wrap" aria-hidden="true">!</div>
        <div class="warning-text">Pastikan Anda melakukan konfirmasi sebelum menyerahkan barang.</div>
      </div>

    </div>

    <!-- Home Indicator -->
    <div class="bottom-bar" aria-hidden="true">
      <div class="home-indicator"></div>
    </div>

  </main>

  <script src="js/detail-temuan.js"></script>
</body>
</html>
