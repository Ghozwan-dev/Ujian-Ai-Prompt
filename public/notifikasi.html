<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Notifikasi — Barang Temuan">
  <title>Notifikasi — Barang Temuan</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/notifikasi.css">
</head>
<body>

  <!-- Mobile Frame Container -->
  <main class="mobile-frame" role="main">

    <!-- Status Bar (08:40, Signal, Wi-Fi, Battery) -->
    <div class="status-bar" aria-label="Status Bar">
      <span class="status-time">08:40</span>
      <div class="status-icons">
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="8" width="2.5" height="3" rx="0.5"></rect>
          <rect x="4" y="5.5" width="2.5" height="5.5" rx="0.5"></rect>
          <rect x="8" y="3" width="2.5" height="8" rx="0.5"></rect>
          <rect x="12" y="0" width="2.5" height="11" rx="0.5"></rect>
        </svg>
        <svg width="15" height="11" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"></path>
          <path d="M4.2 7.7a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 1-1.1 1.1 4 4 0 0 0-5.4 0 .8.8 0 0 1-1.1-1.1z"></path>
          <path d="M1.5 5a9.2 9.2 0 0 1 13 0 .8.8 0 0 1-1.1 1.1 7.6 7.6 0 0 0-10.8 0 .8.8 0 0 1-1.1-1.1z"></path>
        </svg>
        <svg width="22" height="11" viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
          <rect x="1" y="1" width="19" height="10" rx="3"></rect>
          <rect x="3" y="3" width="12" height="6" rx="1.5" fill="currentColor"></rect>
          <path d="M22 4.5v3" stroke-linecap="round"></path>
        </svg>
      </div>
    </div>

    <!-- 2. Header Notifikasi -->
    <header class="page-header">
      <div class="header-left">
        <a href="index.html" class="btn-back" id="btnBack" title="Kembali ke Beranda" aria-label="Kembali ke Beranda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <h1 class="header-title">Notifikasi</h1>
      </div>
      <button type="button" class="btn-mark-all" id="btnMarkAllRead" title="Tandai Semua Telah Dibaca">
        Tandai Semua Dibaca
      </button>
    </header>

    <!-- 3. Filter Notifikasi (Horizontal Row) -->
    <nav class="filter-section" aria-label="Filter Kategori Notifikasi">
      <div class="filter-scroll-row" role="tablist">
        <button type="button" class="filter-chip active" data-filter="all" role="tab" aria-selected="true">
          <span>Semua</span>
          <span class="chip-count" id="countAll">0</span>
        </button>
        <button type="button" class="filter-chip" data-filter="unread" role="tab" aria-selected="false">
          <span>Belum Dibaca</span>
          <span class="chip-count unread-chip-count" id="countUnread">0</span>
        </button>
        <button type="button" class="filter-chip" data-filter="laporan" role="tab" aria-selected="false">
          <span>Laporan</span>
        </button>
        <button type="button" class="filter-chip" data-filter="pesan" role="tab" aria-selected="false">
          <span>Pesan</span>
        </button>
      </div>
    </nav>

    <!-- 4. Daftar Notifikasi (Scrollable List Area) -->
    <div class="notif-content-area" id="notifContentArea">

      <!-- List Container -->
      <div class="notification-list" id="notificationList" role="region" aria-label="Daftar Notifikasi Pengguna">
        <!-- Render dinamis via js/notifikasi.js -->
      </div>

      <!-- 7. Kondisi Kosong (Empty State) -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            <line x1="2" y1="2" x2="22" y2="22" stroke="#94a3b8" stroke-width="1.8"></line>
          </svg>
        </div>
        <h2 class="empty-title" id="emptyTitle">Belum Ada Notifikasi</h2>
        <p class="empty-desc" id="emptyDesc">Pemberitahuan aktivitas Anda akan muncul di sini.</p>
        <a href="index.html" class="btn-empty-action">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3l9-8z"></path>
          </svg>
          <span>Kembali ke Beranda</span>
        </a>
      </div>

    </div>

    <!-- Home Indicator -->
    <div class="bottom-bar" aria-hidden="true">
      <div class="home-indicator"></div>
    </div>

    <!-- Toast Feedback Notification -->
    <div class="toast-feedback" id="notifToast" role="status" aria-live="polite" style="display: none;">
      <svg class="toast-check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span id="toastMsg">Semua notifikasi ditandai dibaca</span>
    </div>

  </main>

  <!-- Script -->
  <script src="js/notifikasi.js"></script>
</body>
</html>
